<header class="account-header">
  <h1>{{ 'ACCOUNT.TITLE' | transloco }}</h1>
  <a class="admin-panel" routerLink="/account/adminpanel">{{ 'ACCOUNT.ADMIN_PANEL' | transloco }}</a>
</header>

<form [attr.aria-label]="'ACCOUNT.PROFILE_DETAILS' | transloco">
  <fieldset>
    <legend>{{ 'ACCOUNT.PERSONAL_INFORMATION' | transloco }}</legend>
    <div class="fields">
      <label>{{ 'ACCOUNT.FIRST_NAME' | transloco }}<input type="text" name="firstName" autocomplete="given-name" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" /></label>
      <label>{{ 'ACCOUNT.LAST_NAME' | transloco }}<input type="text" name="lastName" autocomplete="family-name" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" /></label>
      <label>{{ 'ACCOUNT.MIDDLE_NAME_PATRONYMIC' | transloco }}<input type="text" name="middleName" autocomplete="additional-name" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" /></label>
      <label>{{ 'ACCOUNT.DATE_OF_BIRTH' | transloco }}<input type="date" name="dateOfBirth" autocomplete="bday" enterkeyhint="next" /></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>{{ 'ACCOUNT.CONTACT_INFORMATION' | transloco }}</legend>
    <div class="fields">
      <label>{{ 'ACCOUNT.EMAIL_ADDRESS' | transloco }}<input type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" /></label>
      <label>{{ 'ACCOUNT.PHONE_NUMBER' | transloco }}<input type="tel" name="phone" autocomplete="tel" inputmode="tel" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" /></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>{{ 'ACCOUNT.ADDRESS' | transloco }}</legend>
    <div class="fields">
      <label class="full-width">{{ 'ACCOUNT.STREET_ADDRESS' | transloco }}<textarea name="streetAddress" autocomplete="street-address" rows="2" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next"></textarea></label>
      <label>{{ 'ACCOUNT.CITY' | transloco }}<input type="text" name="city" autocomplete="address-level2" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" /></label>
      <label>{{ 'ACCOUNT.STATE_PROVINCE_REGION' | transloco }}<input type="text" name="region" autocomplete="address-level1" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" /></label>
      <label>{{ 'ACCOUNT.POSTAL_CODE' | transloco }}<input type="text" name="postalCode" autocomplete="postal-code" inputmode="numeric" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" /></label>
      <label>{{ 'ACCOUNT.COUNTRY' | transloco }}<input type="text" name="country" autocomplete="country-name" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="done" /></label>
    </div>
  </fieldset>
</form>
