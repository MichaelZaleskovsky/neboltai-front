<section class="demo">
  <h1>{{ 'DEMO.TITLE' | transloco }}</h1>
  <p class="hint">{{ 'DEMO.HINT' | transloco }}</p>

  <div class="grid">
    <figure>
      <figcaption>{{ 'DEMO.TILED' | transloco }}</figcaption>
      <div class="viewer">
        <app-osd-viewer #dzi [tileSources]="dziSource" (loadError)="dziError.set($event)" />
      </div>
      @if (dziError()) {
        <p class="err">{{ dziError() }}</p>
      }
    </figure>

    <figure>
      <figcaption>{{ 'DEMO.SINGLE' | transloco }}</figcaption>
      <div class="viewer">
        <app-osd-viewer #img [tileSources]="imageSource" (loadError)="imageError.set($event)" />
      </div>
      @if (imageError()) {
        <p class="err">{{ imageError() }}</p>
      }
    </figure>
  </div>
</section>
