<div class="top-bar">
  <a class="brand" routerLink="/about" [attr.aria-label]="'COMMON.BRAND_HOME_ARIA' | transloco">
    <img class="brand-logo" src="logo.jpg" [alt]="'COMMON.BRAND_LOGO_ALT' | transloco" />
  </a>

  <div class="top-actions">
    <label class="lang">
      <span class="visually-hidden">{{ 'HEADER.LANGUAGE' | transloco }}</span>
      <select (change)="setLang($any($event.target).value)">
        @for (l of languages; track l) {
          <option [value]="l" [selected]="l === lang()">{{ languageNames[l] }}</option>
        }
      </select>
    </label>

    @if (isAdmin()) {
      <a class="action admin-link" routerLink="/admin">{{ 'HEADER.ADMIN_PANEL' | transloco }}</a>
    }

    @if (isLoggedIn()) {
      <span class="action account">{{ user()?.name }}</span>
      <button type="button" class="action link-button" (click)="logout()">
        {{ 'HEADER.LOGOUT' | transloco }}
      </button>
    } @else {
      <a class="action link-button" routerLink="/login">
        {{ 'HEADER.LOGIN' | transloco }}
      </a>
    }
  </div>
</div>
