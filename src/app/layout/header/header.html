<div class="top-bar">
  <a class="brand" routerLink="/about" [attr.aria-label]="'COMMON.BRAND_HOME_ARIA' | transloco">
    <img class="brand-logo" src="ne_boltai-1.png" [alt]="'COMMON.BRAND_LOGO_ALT' | transloco" />
  </a>

  <div class="top-actions">
    <label class="lang">
      <span class="visually-hidden">{{ 'HEADER.LANGUAGE' | transloco }}</span>
      <select (change)="setLang($any($event.target).value)">
        @for (l of languages; track l) {
          <option [value]="l" [selected]="l === lang()">{{ languageNames[l] }}</option>
        }
      </select>
    </label>

    <button type="button" class="login-button" (click)="toggleLogin()">
      {{ isLoggedIn() ? ('HEADER.LOGOUT' | transloco) : ('HEADER.LOGIN' | transloco) }}
    </button>
    <a class="account-link" routerLink="/account" [attr.aria-label]="'HEADER.ACCOUNT' | transloco" [attr.title]="'HEADER.ACCOUNT' | transloco">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
      </svg>
    </a>
  </div>
</div>
